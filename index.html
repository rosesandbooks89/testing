<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Chore Champ"><meta name="theme-color" content="#1267E5"><title>Chore Champ</title><style>:root{--b:#1267E5;--r:#F43F3F;--y:#FFD51F;--g:#28B85A;--n:#073B8C;--ink:#172033}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 8% 8%,#ffd51f55 0 7%,transparent 7.2%),radial-gradient(circle at 92% 18%,#f43f3f30 0 8%,transparent 8.2%),linear-gradient(#dff2ff,#f7fbff 62%,#fff7d6);min-height:100vh}.wrap{max-width:760px;margin:auto;padding:18px 14px 110px}.hero{color:#fff;background:linear-gradient(135deg,var(--b),#0A55C8);border:4px solid #fff;border-radius:28px;padding:18px;box-shadow:0 9px 0 #073b8c26,0 18px 30px #1267e52b;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;width:80px;height:80px;border-radius:50%;background:var(--y);right:-28px;top:-24px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative}.eyebrow{font-size:12px;font-weight:950;letter-spacing:.12em;text-transform:uppercase}.hero .eyebrow,.hero .muted{color:#eaf6ff}h1{font-size:34px;line-height:1;margin:6px 0 5px;font-weight:950}h2{margin:0 0 10px}.muted{color:#707b91}.small{font-size:13px}.card{background:#fff;border:3px solid #d8e9f8;border-radius:23px;padding:16px;margin:13px 0;box-shadow:0 6px 0 #c9def1}.chore{position:relative;overflow:hidden}.chore:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--b)}.btn{border:0;border-radius:16px;padding:12px 15px;font-weight:950;font-size:15px;background:var(--b);color:#fff;box-shadow:0 5px 0 var(--n)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--n)}.btn.red{background:var(--r);box-shadow:0 5px 0 #a91f1f}.btn.green{background:var(--g);box-shadow:0 5px 0 #137235}.btn.yellow{background:var(--y);color:#302700;box-shadow:0 5px 0 #c7a700}.btn.alt{background:#fff;color:var(--ink);border:2px solid #cfe1f2;box-shadow:0 5px 0 #d6e6f4}.pill{border:3px solid #fff;background:var(--y);border-radius:999px;padding:10px 13px;font-weight:950;box-shadow:0 4px 0 #0002}.money{font-size:17px;font-weight:950;color:#0b7f3b;background:#e8ffe9;border:2px solid #9be6a8;border-radius:999px;padding:7px 10px;white-space:nowrap}.status{display:inline-block;margin-top:6px;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:950;border:2px solid}.assigned{background:#e7f1ff;color:#0753b8;border-color:#9ac8ff}.submitted{background:#fff7b8;color:#6a5200;border-color:#f4d425}.approved{background:#dcf9e2;color:#126a32;border-color:#7cd38f}.needs_fix{background:#ffe1e1;color:#a81e1e;border-color:#ff9a9a}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.stat{background:#fff;border:3px solid #d9e9f8;border-radius:20px;padding:15px;box-shadow:0 6px 0 #c7ddf0}.stat b{display:block;font-size:27px;margin-top:3px}.icon{font-size:27px;display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:#eff7ff;margin-right:10px}.title{display:flex;align-items:center}.input{width:100%;border:3px solid #cde2f4;background:#fff;border-radius:15px;padding:12px;font-size:16px;outline:none}.input:focus{border-color:var(--b);box-shadow:0 0 0 4px #1267e51a}.label{display:block;font-size:13px;font-weight:950;margin:12px 0 6px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:4px solid #d9e9f8;display:flex;justify-content:center;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}.tabs button{border:0;border-radius:15px;padding:11px 15px;font-weight:950;background:#eef6fc}.tabs [data-v=today].active{background:var(--b);color:#fff}.tabs [data-v=assign].active{background:var(--y)}.tabs [data-v=rewards].active{background:var(--g);color:#fff}.progress{height:16px;background:#fff;border:3px solid #c8dff2;border-radius:999px;overflow:hidden;margin-top:8px}.progress div{height:100%;background:linear-gradient(90deg,var(--r) 0 33%,var(--y) 33% 66%,var(--g) 66%)}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.badge{background:#fff;color:#17416d;border:2px solid #bfddf6;border-radius:999px;padding:7px 9px;font-size:12px;font-weight:950}.quick{display:flex;gap:8px;overflow-x:auto;padding:3px 0 7px}.quick button{white-space:nowrap;border:2px solid #ffd51f;background:#fff9c9;border-radius:999px;padding:9px 11px;font-weight:900}.notice{background:#fff6b3;border:3px solid var(--y);border-radius:18px;padding:13px;margin:12px 0}.full{width:100%}.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:99;pointer-events:none;animation:fall 1.4s linear forwards}@keyframes fall{to{transform:translate(var(--d),110vh) rotate(720deg)}}@media(max-width:480px){h1{font-size:30px}.row{align-items:flex-start}.icon{width:42px;height:42px}.btn{font-size:14px}}</style></head><body><div id="app"></div><div id="tabs" class="tabs"></div><script>const KEY='chorechamp-live-v2',LIB_URL='https://newvsfnbboznkfumlqli.supabase.co/functions/v1/chore-library',ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ld3ZzZm5iYm96bmtmdW1scWxpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NjMwNTksImV4cCI6MjEwMjIzOTA1OX0.krXjDZ9BRaRcySCs10yjMFTzTO_BpAaLkRv0iJQblJM';let s=JSON.parse(localStorage.getItem(KEY)||'null')||{mode:'kid',view:'today',pin:null,chores:[{id:1,title:'Make bed',room:'Bedroom',reward:25,status:'assigned'},{id:2,title:'Feed pets',room:'Pets',reward:50,status:'assigned'},{id:3,title:'Take out kitchen trash',room:'Kitchen',reward:75,status:'submitted'}]};s.usage=s.usage||{};let library=[];const fallback=[{room:'Bedroom',category:'Daily',title:'Make bed',suggested_reward_cents:25},{room:'Pets',category:'Pets',title:'Feed pets',suggested_reward_cents:50},{room:'Kitchen',category:'Dishes',title:'Load dishwasher',suggested_reward_cents:75},{room:'Bathroom',category:'Cleaning',title:'Clean bathroom sink',suggested_reward_cents:75},{room:'Laundry Room',category:'Laundry',title:'Fold laundry',suggested_reward_cents:100},{room:'Outside',category:'Yard',title:'Pick up yard',suggested_reward_cents:100}];const save=()=>localStorage.setItem(KEY,JSON.stringify(s)),$=q=>document.querySelector(q),money=n=>'$'+(n/100).toFixed(2),status=x=>({assigned:'TO DO',submitted:'WAITING',approved:'APPROVED',needs_fix:'FIX IT'})[x]||x;function ico(r,t=''){r=(r||'').toLowerCase();t=t.toLowerCase();if(r.includes('pet'))return'🐾';if(r.includes('kitchen'))return'🍽️';if(r.includes('bath'))return'🫧';if(r.includes('bed'))return'🛏️';if(r.includes('laundry'))return'🧺';if(r.includes('outside'))return'🌳';if(r.includes('garage'))return'🧰';if(t.includes('trash'))return'🗑️';return'⭐'}function confetti(){let c=['#1267E5','#F43F3F','#FFD51F','#28B85A'];for(let i=0;i<45;i++){let e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=c[i%4];e.style.setProperty('--d',(Math.random()*180-90)+'px');e.style.animationDelay=Math.random()*.2+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),1700)}}function card(c,kid){return'<div class="card chore"><div class="row"><div class="title"><div class="icon">'+ico(c.room,c.title)+'</div><div><div class="muted small">'+c.room+'</div><h2 style="margin:3px 0">'+c.title+'</h2><span class="status '+c.status+'">'+status(c.status)+'</span></div></div><div class="money">⭐ '+money(c.reward)+'</div></div>'+(kid&&['assigned','needs_fix'].includes(c.status)?'<label class="btn yellow" style="display:inline-block;margin-top:14px">📷 Take proof photo<input data-proof="'+c.id+'" type="file" accept="image/*" capture="environment" hidden></label>':'')+(s.mode==='parent'&&c.status==='submitted'?'<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn green" data-ok="'+c.id+'">🎉 Approve</button><button class="btn red" data-fix="'+c.id+'">↩ Needs fixing</button></div>':'')+'</div>'}function setup(){document.body.innerHTML='<div class="wrap"><div class="hero"><div class="eyebrow">⭐ Chore Champ ⭐</div><h1>Parent setup</h1><p class="muted">Create a 4-digit parent PIN.</p></div><div class="card"><input id="p1" class="input" inputmode="numeric" maxlength="4" placeholder="4-digit PIN"><button id="make" class="btn full" style="margin-top:12px">🔐 Create Parent PIN</button></div></div>';$('#make').onclick=()=>{let p=$('#p1').value.trim();if(!/^\d{4}$/.test(p))return alert('Please use 4 numbers.');s.pin=p;s.mode='parent';save();location.reload()}}function mostUsed(){return Object.entries(s.usage).filter(x=>x[1]>=2).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,count])=>{let [room,title]=k.split('|||');let item=library.find(x=>x.room===room&&x.title===title);return item?{...item,count}:null}).filter(Boolean)}function assignView(){let rooms=[...new Set(library.map(x=>x.room))].sort(),used=mostUsed();return'<div class="card"><h2>➕ Assign a chore</h2>'+(used.length?'<div class="label">⭐ Most Used</div><div class="quick">'+used.map(x=>'<button data-quick="'+encodeURIComponent(x.room+'|||'+x.title)+'">'+ico(x.room,x.title)+' '+x.title+' ×'+x.count+'</button>').join('')+'</div>':'')+'<label class="label">1. Room / area</label><select id="roomSel" class="input"><option value="">Choose a room...</option>'+rooms.map(r=>'<option>'+r+'</option>').join('')+'</select><label class="label">2. Category</label><select id="catSel" class="input" disabled><option>Choose a room first...</option></select><label class="label">3. Chore</label><select id="choreSel" class="input" disabled><option>Choose a category first...</option></select><label class="label">Reward</label><input id="reward" class="input" inputmode="decimal" placeholder="0.00"><button id="add" class="btn yellow full" style="margin-top:12px" disabled>⭐ Assign chore</button></div><div class="notice"><b>270 built-in chores:</b> organized by room and chore type. Rewards are suggested amounts—you can change them before assigning.</div>'}function populateCats(room,chosenCat=''){let el=$('#catSel'),cats=[...new Set(library.filter(x=>x.room===room).map(x=>x.category))].sort();el.disabled=!room;el.innerHTML='<option value="">Choose a category...</option>'+cats.map(c=>'<option'+(c===chosenCat?' selected':'')+'>'+c+'</option>').join('');$('#choreSel').disabled=true;$('#choreSel').innerHTML='<option>Choose a category first...</option>';$('#add').disabled=true}function populateChores(room,cat,chosen=''){let items=library.filter(x=>x.room===room&&x.category===cat),el=$('#choreSel');el.disabled=!cat;el.innerHTML='<option value="">Choose a chore...</option>'+items.map(x=>'<option value="'+encodeURIComponent(x.title)+'"'+(x.title===chosen?' selected':'')+'>'+x.title+'</option>').join('');$('#add').disabled=true}function pickItem(room,title){let item=library.find(x=>x.room===room&&x.title===title);if(!item)return;$('#roomSel').value=room;populateCats(room,item.category);populateChores(room,item.category,title);$('#choreSel').value=encodeURIComponent(title);$('#reward').value=(item.suggested_reward_cents/100).toFixed(2);$('#add').disabled=false}function render(){if(!s.pin)return setup();const app=$('#app'),tabs=$('#tabs');if(s.mode==='kid'){let earned=s.chores.filter(c=>c.status==='approved').reduce((a,c)=>a+c.reward,0),wait=s.chores.filter(c=>c.status==='submitted').reduce((a,c)=>a+c.reward,0),done=s.chores.filter(c=>c.status==='approved').length,total=s.chores.length,pct=total?Math.round(done/total*100):0;app.innerHTML='<main class="wrap"><div class="hero"><div class="top"><div><div class="eyebrow">🏆 Kid View</div><h1>Today’s Missions!</h1><div class="muted">'+s.chores.filter(c=>c.status!=='approved').length+' chores need attention</div></div><button id="parent" class="pill">🔐 Parent</button></div><div style="margin-top:14px;font-weight:900">Daily progress '+pct+'%</div><div class="progress"><div style="width:'+pct+'%"></div></div><div class="badges"><span class="badge">⭐ '+done+' approved</span><span class="badge">📸 '+s.chores.filter(c=>c.status==='submitted').length+' waiting</span></div></div><div class="stats"><div class="stat"><span class="muted">💰 Earned</span><b>'+money(earned)+'</b></div><div class="stat"><span class="muted">⏳ Waiting</span><b>'+money(wait)+'</b></div></div>'+s.chores.map(c=>card(c,true)).join('')+'</main>';tabs.innerHTML='';$('#parent').onclick=()=>{let p=prompt('Parent PIN');if(p===s.pin){s.mode='parent';save();render()}else if(p!==null)alert('Wrong PIN')}}else{let body=s.view==='today'?'<div class="stats"><div class="stat"><span class="muted">📸 Needs approval</span><b>'+s.chores.filter(c=>c.status==='submitted').length+'</b></div><div class="stat"><span class="muted">✅ Approved</span><b>'+money(s.chores.filter(c=>c.status==='approved').reduce((a,c)=>a+c.reward,0))+'</b></div></div>'+s.chores.map(c=>card(c,false)).join(''):s.view==='assign'?assignView():'<div class="card"><h2>🏆 Rewards</h2><div class="row"><span><b>Approved & earned</b><div class="muted small">Only approved chores count</div></span><div class="money">⭐ '+money(s.chores.filter(c=>c.status==='approved').reduce((a,c)=>a+c.reward,0))+'</div></div><button id="paid" class="btn green full" style="margin-top:16px">💵 Mark rewards paid</button></div>';app.innerHTML='<main class="wrap"><div class="hero"><div class="top"><div><div class="eyebrow">🛡️ Parent Dashboard</div><h1>Chore Champ</h1><div class="muted">Assign • Review • Reward</div></div><button id="kid" class="pill">🎮 Kid View</button></div></div>'+body+'</main>';tabs.innerHTML='<button data-v="today" class="'+(s.view==='today'?'active':'')+'">🏠 Today</button><button data-v="assign" class="'+(s.view==='assign'?'active':'')+'">➕ Assign</button><button data-v="rewards" class="'+(s.view==='rewards'?'active':'')+'">🏆 Rewards</button>';$('#kid').onclick=()=>{s.mode='kid';save();render()};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{s.view=b.dataset.v;save();render()});if(s.view==='assign')bindAssign();if($('#paid'))$('#paid').onclick=()=>{if(confirm('Clear approved chores after paying them?')){s.chores=s.chores.filter(c=>c.status!=='approved');save();render()}}}bind()}function bindAssign(){let r=$('#roomSel'),c=$('#catSel'),ch=$('#choreSel');r.onchange=()=>populateCats(r.value);c.onchange=()=>populateChores(r.value,c.value);ch.onchange=()=>{let title=decodeURIComponent(ch.value||'');let item=library.find(x=>x.room===r.value&&x.title===title);if(item){$('#reward').value=(item.suggested_reward_cents/100).toFixed(2);$('#add').disabled=false}else $('#add').disabled=true};document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{let [room,title]=decodeURIComponent(b.dataset.quick).split('|||');pickItem(room,title)});$('#add').onclick=()=>{let title=decodeURIComponent(ch.value||''),item=library.find(x=>x.room===r.value&&x.title===title);if(!item)return;let reward=Math.round(parseFloat($('#reward').value||'0')*100);s.chores.push({id:Date.now(),title:item.title,room:item.room,reward:isNaN(reward)?item.suggested_reward_cents:reward,status:'assigned'});let key=item.room+'|||'+item.title;s.usage[key]=(s.usage[key]||0)+1;save();s.view='today';render()}}function bind(){document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{s.chores.find(c=>c.id==b.dataset.ok).status='approved';save();confetti();render()});document.querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>{s.chores.find(c=>c.id==b.dataset.fix).status='needs_fix';save();render()});document.querySelectorAll('[data-proof]').forEach(i=>i.onchange=()=>{if(i.files&&i.files[0]){s.chores.find(c=>c.id==i.dataset.proof).status='submitted';save();render()}})}async function loadLibrary(){try{let res=await fetch(LIB_URL,{headers:{Authorization:'Bearer '+ANON,apikey:ANON}});if(!res.ok)throw Error('library');let d=await res.json();library=d.chores||fallback}catch(e){library=fallback}render()}loadLibrary();</script></body></html>
