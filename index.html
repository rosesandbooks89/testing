<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Chore Champ"><meta name="theme-color" content="#f6f1e8"><title>Chore Champ</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f1e8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:20px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:#777;text-transform:uppercase}h1{font-size:34px;margin:4px 0 2px}h2{margin:0 0 12px}.muted{color:#777}.card{background:#fff;border:1px solid #e6dfd5;border-radius:22px;padding:17px;margin:12px 0;box-shadow:0 8px 24px #463b2b0b}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{border:0;border-radius:15px;padding:12px 15px;font-weight:800;background:#222;color:#fff}.btn.alt{background:#fff;color:#222;border:1px solid #ddd}.pill{border:0;background:#fff;border-radius:999px;padding:10px 13px;font-weight:800}.money{font-size:18px;font-weight:900}.status{display:inline-block;margin-top:6px;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900}.assigned{background:#e9eef9}.submitted{background:#fff0b8}.approved{background:#dff3e2}.needs_fix{background:#ffdeda}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.stat{background:#fff;border-radius:20px;padding:16px;border:1px solid #e5ded4}.stat b{display:block;font-size:25px;margin-top:4px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5ded4;display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.tabs button{border:0;background:none;border-radius:13px;padding:10px 16px;font-weight:800}.tabs .active{background:#eee9e1}.input{width:100%;border:1px solid #ddd5c9;background:#fff;border-radius:14px;padding:12px;font-size:16px}.notice{background:#fff8d9;border:1px solid #eedf95;border-radius:16px;padding:12px 14px;margin:12px 0}.setup{max-width:480px;margin:50px auto}.small{font-size:13px}.full{width:100%}</style></head><body><div id="app"></div><div id="tabs" class="tabs"></div><script>const KEY='chorechamp-live-v2';let s=JSON.parse(localStorage.getItem(KEY)||'null')||{mode:'kid',view:'today',pin:null,chores:[{id:1,title:'Make bed',room:'Bedroom',reward:25,status:'assigned'},{id:2,title:'Feed pets',room:'Pets',reward:50,status:'assigned'},{id:3,title:'Take out kitchen trash',room:'Kitchen',reward:75,status:'submitted'}]};const save=()=>localStorage.setItem(KEY,JSON.stringify(s));const $=q=>document.querySelector(q);const money=n=>'$'+(n/100).toFixed(2);const st=x=>({assigned:'TO DO',submitted:'WAITING',approved:'APPROVED',needs_fix:'FIX IT'})[x]||x;function card(c,kid){return '<div class="card"><div class="row"><div><div class="muted small">'+c.room+'</div><h2 style="margin:4px 0">'+c.title+'</h2><span class="status '+c.status+'">'+st(c.status)+'</span></div><div class="money">'+money(c.reward)+'</div></div>'+(kid&&['assigned','needs_fix'].includes(c.status)?'<label class="btn" style="display:inline-block;margin-top:14px">📷 Take proof photo<input data-proof="'+c.id+'" type="file" accept="image/*" capture="environment" hidden></label>':'')+(s.mode==='parent'&&c.status==='submitted'?'<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" data-ok="'+c.id+'">Approve</button><button class="btn alt" data-fix="'+c.id+'">Needs fixing</button></div>':'')+'</div>'}function setup(){document.body.innerHTML='<div class="wrap setup"><div class="eyebrow">Chore Champ</div><h1>Parent setup</h1><p class="muted">Create a 4-digit parent PIN. Your child will not need the PIN to use Kid View.</p><input id="p1" class="input" inputmode="numeric" maxlength="4" placeholder="4-digit PIN"><button id="make" class="btn full" style="margin-top:12px">Create Parent PIN</button></div>';$('#make').onclick=()=>{let p=$('#p1').value.trim();if(!/^\d{4}$/.test(p)){alert('Please use 4 numbers.');return}s.pin=p;s.mode='parent';save();location.reload()}}function render(){if(!s.pin){setup();return}const app=$('#app'),tabs=$('#tabs');if(s.mode==='kid'){let earned=s.chores.filter(c=>c.status==='approved').reduce((a,c)=>a+c.reward,0),wait=s.chores.filter(c=>c.status==='submitted').reduce((a,c)=>a+c.reward,0);app.innerHTML='<main class="wrap"><div class="top"><div><div class="eyebrow">Kid View</div><h1>Today 👋</h1><div class="muted">'+s.chores.filter(c=>c.status!=='approved').length+' chores still need attention</div></div><button id="parent" class="pill">Parent</button></div><div class="stats"><div class="stat"><span class="muted">Earned</span><b>'+money(earned)+'</b></div><div class="stat"><span class="muted">Waiting</span><b>'+money(wait)+'</b></div></div>'+s.chores.map(c=>card(c,true)).join('')+'</main>';tabs.innerHTML='';$('#parent').onclick=()=>{let p=prompt('Parent PIN');if(p===s.pin){s.mode='parent';save();render()}else if(p!==null)alert('Wrong PIN')};}else{let body='';if(s.view==='today'){body='<div class="stats"><div class="stat"><span class="muted">Needs approval</span><b>'+s.chores.filter(c=>c.status==='submitted').length+'</b></div><div class="stat"><span class="muted">Approved</span><b>'+money(s.chores.filter(c=>c.status==='approved').reduce((a,c)=>a+c.reward,0))+'</b></div></div>'+s.chores.map(c=>card(c,false)).join('')}if(s.view==='assign'){body='<div class="card"><h2>Assign a chore</h2><input id="title" class="input" placeholder="Chore name"><input id="room" class="input" style="margin-top:8px" placeholder="Room / area"><input id="reward" class="input" style="margin-top:8px" inputmode="decimal" placeholder="Reward, e.g. 1.00"><button id="add" class="btn full" style="margin-top:10px">Assign chore</button></div><div class="notice"><b>Coming next:</b> connect this screen to the 270-chore cloud library, family sync, photo storage, recurring schedules and reminders.</div>'}if(s.view==='rewards'){let earned=s.chores.filter(c=>c.status==='approved').reduce((a,c)=>a+c.reward,0);body='<div class="card"><h2>Rewards</h2><div class="row"><span>Approved & earned</span><div class="money">'+money(earned)+'</div></div><button id="paid" class="btn full" style="margin-top:16px">Mark approved rewards paid</button></div>'}app.innerHTML='<main class="wrap"><div class="top"><div><div class="eyebrow">Parent Dashboard</div><h1>Chore Champ</h1></div><button id="kid" class="pill">Kid View</button></div>'+body+'</main>';tabs.innerHTML='<button data-v="today" class="'+(s.view==='today'?'active':'')+'">Today</button><button data-v="assign" class="'+(s.view==='assign'?'active':'')+'">Assign</button><button data-v="rewards" class="'+(s.view==='rewards'?'active':'')+'">Rewards</button>';$('#kid').onclick=()=>{s.mode='kid';save();render()};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{s.view=b.dataset.v;save();render()});if($('#add'))$('#add').onclick=()=>{let title=$('#title').value.trim(),room=$('#room').value.trim()||'Other',r=Math.round(parseFloat($('#reward').value||'0')*100);if(!title)return alert('Add a chore name');s.chores.push({id:Date.now(),title,room,reward:isNaN(r)?0:r,status:'assigned'});save();s.view='today';render()};if($('#paid'))$('#paid').onclick=()=>{if(confirm('Clear approved chores after paying them?')){s.chores=s.chores.filter(c=>c.status!=='approved');save();render()}}}bind()}function bind(){document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{s.chores.find(c=>c.id==b.dataset.ok).status='approved';save();render()});document.querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>{s.chores.find(c=>c.id==b.dataset.fix).status='needs_fix';save();render()});document.querySelectorAll('[data-proof]').forEach(i=>i.onchange=()=>{if(i.files&&i.files[0]){s.chores.find(c=>c.id==i.dataset.proof).status='submitted';save();render()}})}render();</script></body></html>
